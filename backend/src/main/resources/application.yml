# backend/src/main/resources/application.yml
server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pdf_db_v3?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 5748
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  browser:
    launch: true
  template:
    path: ./certificate_template.docx
  vbs:
    script-path: ./docx2pdf.vbs
    batch-script-path: ./docx2pdf_batch.vbs
    batch-size: 30

logging:
  level:
    org.hibernate.SQL: debug
    com.example.pdfgen: debug
  file:
    name: C:/work/pdf-generator-v3/backend/app.log